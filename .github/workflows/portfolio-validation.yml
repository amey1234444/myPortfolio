name: Portfolio validation

on:
  push:
    branches: [main, feat/portfolio-paper-cobalt]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@10
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Calendar and interaction tests
        run: pnpm exec jest src/lib/activity.test.ts src/lib/activity-api.test.ts src/components/Studio/Studio.test.tsx src/components/Portfolio/Portfolio.test.tsx src/components/Header/Header.test.tsx --runInBand
      - name: Production build
        run: pnpm run build
      - name: Install browser checker
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-browser" playwright@1.55.0
          "$RUNNER_TEMP/portfolio-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Desktop and mobile browser checks
        run: node scripts/check-portfolio.cjs
